<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2F5D50">
  <title>龙南客家非遗数字助手 · 阿蓝</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">

    <!-- ======== 顶栏 ======== -->
    <header class="header">
      <div class="header-inner">
        <div class="header-badge">数智传薪 · 非遗远航</div>
        <h1 class="header-title">龙南客家非遗数字助手</h1>
        <div class="header-sub">扫码即用 · 问答即懂</div>
      </div>
      <button class="qr-btn" id="qrBtn" type="button" aria-label="展示二维码">二维码</button>
    </header>

    <!-- ======== 可滚动内容区 ======== -->
    <main class="main" id="main">

      <!-- 虚拟形象 + 欢迎 -->
      <section class="hero">
        <div class="avatar-wrap" id="avatarWrap">
          <svg class="avatar" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg" aria-label="虚拟讲解员阿蓝">
            <!-- 发髻 -->
            <circle cx="34" cy="24" r="12" fill="#3A2F2A"/>
            <circle cx="86" cy="24" r="12" fill="#3A2F2A"/>
            <!-- 发髻小花 -->
            <circle cx="34" cy="18" r="3.2" fill="#E8A0BF"/>
            <circle cx="34" cy="18" r="1.3" fill="#FFF6E8"/>
            <circle cx="86" cy="18" r="3.2" fill="#C45C26"/>
            <circle cx="86" cy="18" r="1.3" fill="#FFF6E8"/>
            <!-- 头发后层 -->
            <path d="M22 52 C22 28 42 18 60 18 C78 18 98 28 98 52 L98 64 C98 66 96 68 94 66 L90 58 C84 66 72 70 60 70 C48 70 36 66 30 58 L26 66 C24 68 22 66 22 64 Z" fill="#3A2F2A"/>
            <!-- 脸 -->
            <ellipse cx="60" cy="50" rx="32" ry="31" fill="#FFDDB8"/>
            <!-- 刘海 -->
            <path d="M28 44 C30 22 50 14 60 14 C70 14 90 22 92 44 C88 36 82 32 74 36 C70 28 64 26 58 30 C52 26 44 28 40 36 C34 32 30 36 28 44 Z" fill="#3A2F2A"/>
            <!-- 耳朵 -->
            <ellipse cx="28" cy="52" rx="5.5" ry="7.5" fill="#FFDDB8"/>
            <ellipse cx="92" cy="52" rx="5.5" ry="7.5" fill="#FFDDB8"/>
            <!-- 眼睛 -->
            <g class="avatar-eyes">
              <ellipse cx="47" cy="52" rx="5.5" ry="6.5" fill="#2A2A2A"/>
              <ellipse cx="73" cy="52" rx="5.5" ry="6.5" fill="#2A2A2A"/>
              <circle cx="49" cy="50" r="2" fill="#FFFFFF"/>
              <circle cx="75" cy="50" r="2" fill="#FFFFFF"/>
              <circle cx="45.5" cy="54.5" r="0.9" fill="#FFFFFF" opacity="0.7"/>
              <circle cx="71.5" cy="54.5" r="0.9" fill="#FFFFFF" opacity="0.7"/>
            </g>
            <!-- 眉毛 -->
            <path d="M40 42 Q47 39.5 54 42" stroke="#3A2F2A" stroke-width="1.4" fill="none" stroke-linecap="round"/>
            <path d="M66 42 Q73 39.5 80 42" stroke="#3A2F2A" stroke-width="1.4" fill="none" stroke-linecap="round"/>
            <!-- 嘴（说话时开合） -->
            <g class="avatar-mouth">
              <path class="mouth-smile" d="M53 63 Q60 69.5 67 63" stroke="#B0563A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
              <ellipse class="mouth-open" cx="60" cy="64.5" rx="5.5" ry="4.2" fill="#C45C3A"/>
            </g>
            <!-- 腮红 -->
            <ellipse cx="38" cy="60" rx="5.5" ry="3.2" fill="#F2A0A0" opacity="0.55"/>
            <ellipse cx="82" cy="60" rx="5.5" ry="3.2" fill="#F2A0A0" opacity="0.55"/>
            <!-- 身体：蓝染上衣 -->
            <path d="M38 82 C38 78 48 75 60 75 C72 75 82 78 82 82 L88 108 C89 112 87 116 83 116 L37 116 C33 116 31 112 32 108 Z" fill="#2F5D50"/>
            <!-- 衣领（交领右衽） -->
            <path d="M50 76 L60 90 L70 76" stroke="#FFF6E8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- 腰带 -->
            <rect x="36" y="100" width="48" height="5" rx="2.5" fill="#C45C26"/>
            <!-- 手臂 -->
            <path d="M38 84 C30 88 26 96 27 104" stroke="#2F5D50" stroke-width="9" fill="none" stroke-linecap="round"/>
            <path d="M82 84 C90 88 94 96 93 104" stroke="#2F5D50" stroke-width="9" fill="none" stroke-linecap="round"/>
            <!-- 手 -->
            <circle cx="27" cy="106" r="5" fill="#FFDDB8"/>
            <circle cx="93" cy="106" r="5" fill="#FFDDB8"/>
            <!-- 围裙（竹纹） -->
            <path d="M46 100 L46 128 Q60 133 74 128 L74 100 Z" fill="#FFF6E8"/>
            <path d="M52 104 Q60 108 68 104" stroke="#7BA89B" stroke-width="1.1" fill="none"/>
            <path d="M50 112 Q60 116 70 112" stroke="#7BA89B" stroke-width="1.1" fill="none"/>
            <path d="M52 120 Q60 124 68 120" stroke="#7BA89B" stroke-width="1.1" fill="none"/>
            <!-- 下摆 -->
            <path d="M37 116 L83 116 L86 132 Q60 138 34 132 Z" fill="#254C42"/>
          </svg>
          <div class="avatar-ring"></div>
        </div>
        <div class="hero-text">
          <div class="hero-name">我是阿蓝 <span class="hero-name-en">A-Lan</span></div>
          <p class="hero-desc">龙南客家非遗数字讲解员，带你探访蓝染、竹编、织带与围屋的故事。</p>
        </div>
      </section>

      <!-- 问答区 -->
      <section class="chat-section" id="chatSection">
        <div class="section-label">
          <span class="section-label-dot"></span>AI 互动问答
        </div>

        <div class="quick-questions" id="quickQuestions">
          <button class="chip" data-q="什么是客家蓝染？" type="button">什么是客家蓝染？</button>
          <button class="chip" data-q="竹编有什么工艺特色？" type="button">竹编有什么特色？</button>
          <button class="chip" data-q="客家织带有什么寓意？" type="button">织带有什么寓意？</button>
          <button class="chip" data-q="龙南为什么叫世界围屋之都？" type="button">围屋之都？</button>
          <button class="chip" data-q="客家童谣是什么？" type="button">客家童谣？</button>
        </div>

        <div class="chat-window" id="chatWindow" aria-live="polite"></div>

        <div class="engine-status" id="engineStatus">当前引擎：本地知识库</div>

        <div class="input-bar">
          <input type="text" id="chatInput" placeholder="问问阿蓝：蓝染、竹编、织带、围屋……" autocomplete="off" enterkeyhint="send">
          <button class="send-btn" id="sendBtn" type="button" aria-label="发送">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3.4 20.4L20.85 12.92C21.66 12.57 21.66 11.43 20.85 11.08L3.4 3.6C2.74 3.31 2 3.8 2 4.51V19.49C2 20.2 2.74 20.69 3.4 20.4ZM20 12L4 12" fill="currentColor"/></svg>
          </button>
        </div>

        <div class="voice-row">
          <label class="voice-toggle">
            <input type="checkbox" id="voiceToggle">
            <span class="voice-toggle-ui"></span>
            <span class="voice-toggle-label">语音朗读回答</span>
          </label>
        </div>
      </section>

      <!-- 非遗科普 -->
      <section class="heritage-section" id="heritageSection">
        <div class="section-label">
          <span class="section-label-dot"></span>非遗科普 · 点击卡片查看详情
        </div>
        <div class="heritage-grid" id="heritageGrid"><!-- js 注入 --></div>
      </section>

      <footer class="footer">
        <div class="footer-brand">数智传薪 · 非遗远航</div>
        <div class="footer-meta">南昌大学 × 龙南旅发集团 产学研平台<br>龙南客家非遗数字助手 · 演示原型</div>
      </footer>
    </main>
  </div>

  <!-- ======== 二维码弹层 ======== -->
  <div class="modal-mask" id="qrModal" hidden>
    <div class="modal-card">
      <button class="modal-close" id="qrClose" type="button" aria-label="关闭">×</button>
      <div class="modal-title">扫码访问数字助手</div>
      <div class="qr-box" id="qrBox"></div>
      <div class="modal-desc" id="qrUrlText"></div>

      <div class="qr-url-row" id="qrPublicRow">
        <label class="qr-url-label" for="qrPublicInput">公网访问地址（可选）</label>
        <div class="qr-url-form">
          <input type="url" id="qrPublicInput" placeholder="https://xxx.trycloudflare.com" autocomplete="off" spellcheck="false">
          <button type="button" id="qrPublicSave">保存</button>
        </div>
        <div class="qr-url-hint" id="qrPublicHint">
          运行 gongwang.bat 获取公网地址，粘贴保存后二维码全网可扫
        </div>
      </div>

      <div class="modal-hint" id="qrModeHint">当前：局域网模式（需同一 Wi-Fi）</div>
    </div>
  </div>

  <!-- ======== 非遗详情弹层 ======== -->
  <div class="modal-mask" id="detailModal" hidden>
    <div class="modal-card modal-card-detail">
      <button class="modal-close" id="detailClose" type="button" aria-label="关闭">×</button>
      <div class="detail-icon" id="detailIcon"></div>
      <div class="modal-title" id="detailTitle"></div>
      <div class="detail-body" id="detailBody"></div>
      <button class="ask-more-btn" id="askMoreBtn" type="button">问问阿蓝更多相关问题</button>
    </div>
  </div>

  <script src="js/secrets.js"></script>
  <script src="js/config.js"></script>
  <script src="js/knowledge-base.js"></script>
  <script src="js/answer-engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
