name: Deploy to GitHub Pages

# GitHub Pages 仅保留 main 主站与豆包 doubao 的只读预览镜像。
# 主站上的 AI 请求走 main Cloudflare Pages Functions 代理，浏览器资源不包含 API key。
# 工作流只在 main 上运行，显式 checkout 两个来源分支。

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.page.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: src-prod
      - uses: actions/checkout@v4
        with:
          ref: doubao
          path: src-doubao

      # 这些静态镜像始终写空 key；线上调用由 main Cloudflare Pages Functions 代理，
      # GitHub Pages 不承担服务端密钥存储。
      - name: 生成空 secrets.js
        run: |
          printf 'window.APP_SECRETS={apiKey:""};' > src-prod/js/secrets.js
          printf 'window.APP_SECRETS={apiKey:""};' > src-doubao/js/secrets.js

      # 白名单发布：只上线页面真正加载的文件。
      - name: 组装站点
        run: |
          set -euo pipefail
          pack() {
            dest="$1"; src="$2"
            mkdir -p "$dest"
            cp "$src/index.html" "$dest/"
            cp -r "$src/css" "$src/js" "$dest/"
            mkdir -p "$dest/assets"
            cp -r "$src/assets/avatar" "$src/assets/pdf-imgs" "$src/assets/textures" "$dest/assets/"
            if [ -d "$src/assets/model-references" ]; then cp -r "$src/assets/model-references" "$dest/assets/"; fi
            if [ -d "$src/assets/model-textures" ]; then cp -r "$src/assets/model-textures" "$dest/assets/"; fi
            if [ -d "$src/assets/audio" ]; then cp -r "$src/assets/audio" "$dest/assets/"; fi
          }
          rm -rf site
          pack site src-prod
          pack site/doubao src-doubao
          echo "上线内容 $(du -sh site | cut -f1)，其中 doubao 预览 $(du -sh site/doubao | cut -f1)"
          find site -maxdepth 1 -mindepth 1 | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: page
        uses: actions/deploy-pages@v4
