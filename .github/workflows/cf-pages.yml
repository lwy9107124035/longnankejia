name: Deploy to Cloudflare Pages

# 固定入口：main → longnankejia；其余工作分支 → longnankejia-dev。
# API 密钥仅作为 Pages Functions 的服务端 secret binding 使用，不写入静态 JS。

on:
  push:
    branches: [main, qcode, codex, doubao, antigravity]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify administrator API and multi-device synchronization
        if: github.ref_name == 'codex' || github.ref_name == 'main'
        run: node --test tests/admin-deployment.test.mjs tests/admin-sync.test.mjs tests/admin-security.test.mjs tests/content-collaboration.test.mjs tests/collaboration-recheck.test.mjs tests/media-storage.test.mjs tests/maintenance-health.test.mjs tests/v3_admin_ux.test.mjs tests/pages-functions.test.mjs

      - name: Bind persistent administrator storage
        if: github.ref_name == 'codex' || github.ref_name == 'main'
        env:
          BRANCH: ${{ github.ref_name }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
          CODEX_ADMIN_D1_ID: ${{ vars.CODEX_ADMIN_D1_ID }}
          MAIN_ADMIN_D1_ID: ${{ vars.MAIN_ADMIN_D1_ID }}
        run: |
          set -euo pipefail
          set +x
          node scripts/prepare_admin_d1.mjs
          if [ "$BRANCH" = codex ]; then
            printf '%s' "$ADMIN_BOOTSTRAP_PASSWORD" | npx --yes wrangler@4.137.0 pages secret put ADMIN_BOOTSTRAP_PASSWORD --project-name=longnankejia-dev --env=preview
          fi

      # 原豆包分支 dev 改名后，把 longnankejia-dev 项目的生产指针一并切到 doubao，
      # 确保稳定根地址仍对应豆包分支；只提交 production_branch 这一项。
      - name: Set Doubao as the preview project's production branch
        if: github.ref_name == 'doubao'
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          node --input-type=module <<'NODE'
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT_ID}/pages/projects/longnankejia-dev`,
            {
              method: 'PATCH',
              headers: {
                Authorization: `Bearer ${process.env.CF_API_TOKEN}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ production_branch: 'doubao' }),
            },
          );
          let result;
          try { result = await response.json(); } catch { result = null; }
          if (!response.ok || !result?.success || result?.result?.production_branch !== 'doubao') {
            console.error(`Cloudflare production branch update failed (HTTP ${response.status}).`);
            process.exit(1);
          }
          console.log('longnankejia-dev production branch verified: doubao');
          NODE

      # 白名单搬运页面资源。Functions 保留在仓库根目录，由 wrangler pages deploy _site
      # 一并发现并部署；API key 通过 stdin 写进 Cloudflare secret binding。
      - name: 组装站点并同步服务端密钥
        id: prep
        env:
          BRANCH: ${{ github.ref_name }}
          CF_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          case "$BRANCH" in
            main)
              PROJECT=longnankejia
              CF_ENV=production
              ;;
            doubao)
              PROJECT=longnankejia-dev
              CF_ENV=production
              ;;
            qcode|codex|antigravity)
              PROJECT=longnankejia-dev
              CF_ENV=preview
              ;;
            *)
              echo "拒绝部署未列入白名单的分支：$BRANCH" >&2
              exit 1
              ;;
          esac
          if [ "$BRANCH" != main ] && [ -z "$CF_KEY" ]; then
            echo "GitHub Actions secret SILICONFLOW_API_KEY 未配置" >&2
            exit 1
          fi

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "environment=$CF_ENV" >> "$GITHUB_OUTPUT"
          if [ "$BRANCH" = main ]; then
            echo "保留正式站现有服务端密钥，不覆盖或重设。"
          else
            printf '%s' "$CF_KEY" | npx --yes wrangler@4.137.0 pages secret put SILICONFLOW_API_KEY --project-name="$PROJECT" --env="$CF_ENV"
          fi
          unset CF_KEY

          rm -rf _site && mkdir -p _site/assets
          cp index.html _headers _site/
          cp -r css js _site/
          cp -r assets/avatar assets/pdf-imgs assets/textures assets/model-references assets/model-textures assets/audio _site/assets/
          printf 'window.APP_SECRETS={apiKey:""};' > _site/js/secrets.js
          echo "上线 $(du -sh _site | cut -f1)，$(find _site -type f | wc -l) 个文件；浏览器密钥为空，API 由 Pages Functions 代理。"

      - name: 部署
        if: github.ref_name != 'codex'
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.137.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ steps.prep.outputs.project }} --branch=${{ github.ref_name }} --commit-dirty=true

      - name: Deploy codex with persistent administrator binding
        if: github.ref_name == 'codex'
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.137.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=longnankejia-dev --branch=codex --commit-dirty=true
