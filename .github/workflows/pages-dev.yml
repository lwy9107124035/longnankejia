name: Deploy dev preview to GitHub Pages

# 为什么放在 main 上却部署 dev：GitHub 读取「被 push 的那个 ref」里的工作流文件，
# 而 dev 是豆包的专属分支（见 dev 上的 AI_OWNER.md），我不该往里提交。
# 所以这个文件留在 main，用 ref: dev 显式取开发分支的内容。
# 等 main 与 dev 之间走过一次合并后，push: branches: [dev] 会自动生效；
# 在那之前靠定时与手动触发保持新鲜。

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      ref:
        description: 要部署的分支
        required: false
        default: dev
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.page.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'dev' }}

      # 预览站是公开域名，会把密钥再暴露一份到 Pages 上；这个 key 之前已经泄露过一次。
      # 所以这里刻意不注入线上密钥：没有密钥时页面按设计回落到本地知识库引擎。
      - name: 生成空密钥（预览站不带你线上 key）
        run: echo 'window.APP_SECRETS={apiKey:""};' > js/secrets.js

      - name: 准备站点目录
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude .cache \
                  --exclude _site --exclude _archive ./ ./_site/
          du -sh ./_site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: page
        uses: actions/deploy-pages@v4
