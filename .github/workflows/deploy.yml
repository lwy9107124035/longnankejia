name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate secrets.js from GitHub Secrets
        run: |
          cat > js/secrets.js << 'SECRETEOF'
          /**
           * Auto-generated by GitHub Actions. Do not edit.
           * API key is injected from repository secret SILICONFLOW_API_KEY.
           */
          window.APP_SECRETS = {
            apiKey: "${{ secrets.SILICONFLOW_API_KEY }}"
          };
          SECRETEOF
          echo "secrets.js generated:"
          cat js/secrets.js | sed 's/sk-[a-zA-Z0-9]*/sk-****(redacted)/'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
