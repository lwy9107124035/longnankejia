name: Deploy to Netlify (备用宿主，手动)

# 2026-09-23 起改成只手动触发：Netlify 转成 credits 计费后，这个账号的免费额度用完
# 且未绑卡，任何新的生产部署都会被挡（CI 里那一步的报错是
# "Account credit usage exceeded - new deploys are blocked until credits are added"）。
# 日常上线走 .github/workflows/pages.yml（GitHub Pages，没有 credits 闸门）。
# 这份留着是因为 Netlify 站点仍在服务上一次成功的部署，等额度重置后可以手动再推一次。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate secrets.js
        run: |
          echo "window.APP_SECRETS={apiKey:\"${{ secrets.SILICONFLOW_API_KEY }}\"};" > js/secrets.js

      - name: Deploy to Netlify
        run: |
          npm install -g netlify-cli
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Deploying branch: $BRANCH"
          if [ "$BRANCH" = "main" ]; then
            netlify deploy --dir . --prod \
              --auth "$NETLIFY_AUTH_TOKEN" \
              --site "$NETLIFY_SITE_ID"
          else
            echo "非 main 分支不再往 Netlify 推别名站（会留下永不更新的公开预览站，"
            echo "dev 别名就是教训）。预览请用 GitHub Pages。"
            exit 1
          fi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
